{{ define "timer_bar" }}
<!-- Datos de Temporizador Activo SSR (Oculto en cabecera) -->
{{if .ActiveTimer}}
<div id="active-timer-container" class="hidden" style="display: none !important;"
     data-server-timer="true"
     data-timesheet-id="{{.ActiveTimer.TimesheetID}}"
     data-project-id="{{.ActiveTimer.ProjectID}}"
     data-project-name="{{.ActiveTimer.ProjectName}}"
     data-task-id="{{.ActiveTimer.TaskID}}"
     data-task-name="{{.ActiveTimer.TaskName}}"
     data-desc="{{.ActiveTimer.Description}}"
     data-accumulated-ms="{{.ActiveTimer.AccumulatedMs}}"
     data-started-at="{{.ActiveTimer.StartedAt}}"
     data-is-running="{{if .ActiveTimer.IsRunning}}true{{else}}false{{end}}">
</div>
{{end}}

<!-- Modal Interactivo de Confirmación Cada 15 Minutos -->
<div id="timer-confirm-modal" class="fixed inset-0 z-[100] overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop con desenfoque de fondo -->
    <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm transition-opacity"></div>

    <div class="flex min-h-screen items-center justify-center p-4 text-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-md border-2 border-amber-300 ring-4 ring-amber-400/20 p-6">
            
            <!-- Icono y Título del Modal -->
            <div class="flex items-center space-x-3 mb-4">
                <div class="flex-shrink-0 w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center relative">
                    <span class="animate-ping absolute inline-flex h-8 w-8 rounded-full bg-amber-400 opacity-50"></span>
                    <svg class="w-6 h-6 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-800 leading-6">
                        ¿Sigues trabajando en este proyecto?
                    </h3>
                    <p id="confirm-modal-desc" class="text-xs text-slate-500">
                        Han transcurrido 5 minutos de trabajo. Confirma para mantener el cronómetro activo.
                    </p>
                </div>
            </div>

            <!-- Ficha de resumen del proyecto activo con cuenta regresiva -->
            <div class="bg-amber-50/60 rounded-xl p-3.5 border border-amber-200 mb-5 space-y-2">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-500 font-medium">Proyecto:</span>
                    <span id="confirm-modal-project" class="font-bold text-slate-800 text-right truncate max-w-[220px]">-</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-500 font-medium">Tarea:</span>
                    <span id="confirm-modal-task" class="font-semibold text-slate-700 text-right truncate max-w-[220px]">-</span>
                </div>
                <div class="flex justify-between items-center text-xs pt-1 border-t border-amber-200/60">
                    <span class="text-slate-500 font-medium">Tiempo acumulado:</span>
                    <span id="confirm-modal-time" class="font-mono font-bold text-sky-700 text-sm">00:05:00</span>
                </div>
                <div class="flex justify-between items-center text-xs pt-1 border-t border-amber-200/60 bg-amber-100/70 -mx-3.5 -mb-3.5 p-2 rounded-b-xl">
                    <span class="text-amber-800 font-semibold flex items-center gap-1.5">
                        <span class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                        Auto-pausa en:
                    </span>
                    <span id="confirm-modal-countdown" class="font-mono font-bold text-amber-900 text-sm">05:00</span>
                </div>
            </div>

            <!-- Acciones de confirmación -->
            <div class="flex flex-col space-y-2 sm:space-y-0 sm:flex-row-reverse sm:gap-2">
                <button type="button" id="confirm-modal-continue-btn" onclick="confirmContinueTimer()"
                        class="w-full sm:w-auto px-5 py-2.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 rounded-xl shadow-md shadow-emerald-600/30 transition flex items-center justify-center space-x-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span>Sí, continuar (Intro)</span>
                </button>

                <button type="button" onclick="confirmPauseTimer()"
                        class="w-full sm:w-auto px-4 py-2.5 text-xs font-bold text-amber-800 bg-amber-100/80 hover:bg-amber-200 border border-amber-300 rounded-xl transition flex items-center justify-center space-x-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Pausar</span>
                </button>

                <button type="button" onclick="confirmFinalizeTimerFromModal()"
                        class="w-full sm:w-auto px-4 py-2.5 text-xs font-bold text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer">
                    <span>Guardar y salir</span>
                </button>
            </div>

            <!-- Nota de atajo de teclado -->
            <p class="text-[10px] text-slate-400 text-center mt-3">
                Pulsa <kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded font-mono text-[9px] text-slate-700 font-bold">Intro</kbd> para confirmar rápidamente
            </p>
        </div>
    </div>
</div>
{{ end }}
