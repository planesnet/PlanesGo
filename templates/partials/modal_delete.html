{{ define "modal_delete" }}
<!-- Modal Confirmar Eliminación de Horas -->
<div id="delete-timesheet-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200/90 w-full max-w-md overflow-hidden transform transition-all duration-200 scale-95 opacity-0" id="delete-modal-container">
        <div class="p-6">
            <div class="flex items-start space-x-4">
                <div class="w-10 h-10 rounded-xl bg-rose-100 flex items-center justify-center text-rose-600 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="text-sm font-bold text-slate-800">Eliminar parte de horas</h3>
                    <p class="text-xs text-slate-500 mt-1">¿Estás seguro de que deseas eliminar este registro de horas en Odoo? Esta acción no se puede deshacer.</p>
                    
                    <div class="mt-3 bg-slate-50 rounded-xl p-3 border border-slate-200/70 text-xs space-y-1">
                        <input type="hidden" id="delete-timesheet-id" value="">
                        <div class="flex justify-between text-slate-600">
                            <span class="font-medium text-slate-500">Fecha:</span>
                            <span id="delete-info-date" class="font-mono font-medium text-slate-800">-</span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span class="font-medium text-slate-500">Proyecto:</span>
                            <span id="delete-info-project" class="font-medium text-slate-800 truncate max-w-[200px]">-</span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span class="font-medium text-slate-500">Tiempo:</span>
                            <span id="delete-info-hours" class="font-bold text-sky-700 font-mono">-</span>
                        </div>
                        <div class="text-slate-600 pt-1 border-t border-slate-200/50">
                            <span class="font-medium text-slate-500 block mb-0.5">Descripción:</span>
                            <span id="delete-info-desc" class="italic text-slate-700 block truncate">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mensaje de feedback / error en el modal de eliminación -->
            <div id="delete-feedback" class="hidden mt-4 p-3 rounded-xl text-xs font-medium"></div>

            <!-- Botones de Acción -->
            <div class="mt-6 flex items-center justify-end space-x-2">
                <button type="button" onclick="closeDeleteModal()"
                        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
                <button type="button" id="btn-confirm-delete" onclick="executeDeleteTimesheet()"
                        class="px-5 py-2 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 active:bg-rose-800 rounded-xl shadow-xs transition flex items-center space-x-2 cursor-pointer">
                    <span id="btn-confirm-delete-text">Eliminar</span>
                    <svg id="btn-confirm-delete-spinner" class="animate-spin -mr-1 ml-1 h-3.5 w-3.5 text-white hidden" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
{{ end }}
