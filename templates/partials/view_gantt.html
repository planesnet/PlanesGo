{{ define "view_gantt" }}
<!-- VISTA 3: Gantt (Timeline semanal) -->
<div id="view-container-gantt" class="hidden space-y-4">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 sm:p-5 overflow-hidden">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-4 border-b border-slate-100">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-800 text-sm">Timeline Gantt Semanal</span>
                <span class="text-xs text-slate-400 font-medium hidden sm:inline">• Distribución de horas por proyecto</span>
            </div>
            <div class="text-xs font-semibold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100 self-start sm:self-auto">
                Total Gantt: <span id="gantt-week-total" class="font-bold">0.00</span> h
            </div>
        </div>
        <div class="overflow-x-auto" id="gantt-table-container">
            <!-- El diagrama Gantt se genera dinámicamente -->
        </div>
    </div>
</div>
{{ end }}
