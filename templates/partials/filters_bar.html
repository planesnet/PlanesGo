{{ define "filters_bar" }}
<!-- Barra de Acciones: Selector de Vistas y Botón Imputar Horas -->
<div class="bg-white p-3 sm:p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-end space-x-2.5 sm:space-x-3">
    <!-- Botonera estilo Odoo con tipos de vista -->
    <div class="inline-flex items-center p-1 bg-slate-100/90 rounded-xl border border-slate-200/90 shadow-2xs" role="group" aria-label="Selector de vistas">
        <!-- Botón Vista Express (Botonera Desacoplada de Escritorio) -->
        <button type="button" id="btn-view-express" onclick="openExpressPopout()"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs {{if eq .CurrentView "express"}}font-semibold text-sky-700 bg-white shadow-2xs border border-slate-200/70{{else}}font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50{{end}} transition-all cursor-pointer flex items-center space-x-1.5"
                title="Botonera Express Desacoplada (Ventana flotante de escritorio)">
            <svg class="w-3.5 h-3.5 {{if eq .CurrentView "express"}}text-sky-600{{else}}text-amber-500{{end}}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span class="text-[11px] font-semibold">Express</span>
        </button>
        <!-- Botón Vista Tickets (A la derecha de la pestaña Express) -->
        <button type="button" id="btn-view-tickets" onclick="switchView('tickets')"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs {{if eq .CurrentView "tickets"}}font-semibold text-sky-700 bg-white shadow-2xs border border-slate-200/70{{else}}font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50{{end}} transition-all cursor-pointer flex items-center space-x-1.5"
                title="Vista Pestaña de Tickets de Soporte Asignados">
            <svg class="w-3.5 h-3.5 {{if eq .CurrentView "tickets"}}text-sky-600{{else}}text-amber-500{{end}}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
            </svg>
            <span class="text-[11px] font-semibold">Tickets</span>
        </button>
        <!-- Botón Vista Lista -->
        <button type="button" id="btn-view-list" onclick="switchView('list')"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs {{if or (eq .CurrentView "list") (not .CurrentView)}}font-semibold text-sky-700 bg-white shadow-2xs border border-slate-200/70{{else}}font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50{{end}} transition-all cursor-pointer flex items-center space-x-1.5"
                title="Vista Lista de Partes de Horas">
            <svg class="w-3.5 h-3.5 {{if or (eq .CurrentView "list") (not .CurrentView)}}text-sky-600{{else}}text-slate-500{{end}}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
            <span class="text-[11px]">Lista</span>
        </button>
        <!-- Botón Vista Calendario (Semanal) -->
        <button type="button" id="btn-view-calendar" onclick="switchView('calendar')"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs {{if eq .CurrentView "calendar"}}font-semibold text-sky-700 bg-white shadow-2xs border border-slate-200/70{{else}}font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50{{end}} transition-all cursor-pointer flex items-center space-x-1.5"
                title="Vista Calendario Semanal">
            <svg class="w-3.5 h-3.5 {{if eq .CurrentView "calendar"}}text-sky-600{{else}}text-slate-500{{end}}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2z" />
            </svg>
            <span class="text-[11px]">Calendario</span>
        </button>
        <!-- Botón Vista Gantt -->
        <button type="button" id="btn-view-gantt" onclick="switchView('gantt')"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs {{if eq .CurrentView "gantt"}}font-semibold text-sky-700 bg-white shadow-2xs border border-slate-200/70{{else}}font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50{{end}} transition-all cursor-pointer flex items-center space-x-1.5"
                title="Vista Gantt (Timeline semanal de tareas)">
            <svg class="w-3.5 h-3.5 {{if eq .CurrentView "gantt"}}text-sky-600{{else}}text-slate-500{{end}}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h18M3 8h10M3 12h14M3 16h6M3 20h12" />
            </svg>
            <span class="text-[11px]">Gantt</span>
        </button>
    </div>
</div>
{{ end }}
