{{ define "filters_bar" }}
<!-- Barra de Acciones: Selector de Vistas y Botón Imputar Horas -->
<div class="bg-white p-3 sm:p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-end space-x-2.5 sm:space-x-3">
    <!-- Botonera estilo Odoo con tipos de vista -->
    <div class="inline-flex items-center p-1 bg-slate-100/90 rounded-xl border border-slate-200/90 shadow-2xs" role="group" aria-label="Selector de vistas">
        <!-- Botón Vista Lista -->
        <button type="button" id="btn-view-list" onclick="switchView('list')"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-sky-700 bg-white shadow-2xs border border-slate-200/70 transition-all cursor-pointer flex items-center space-x-1.5"
                title="Vista Lista de Partes de Horas">
            <svg class="w-3.5 h-3.5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
            <span class="text-[11px]">Lista</span>
        </button>
        <!-- Botón Vista Calendario (Semanal) -->
        <button type="button" id="btn-view-calendar" onclick="switchView('calendar')"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all cursor-pointer flex items-center space-x-1.5"
                title="Vista Calendario Semanal">
            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2z" />
            </svg>
            <span class="text-[11px]">Calendario</span>
        </button>
        <!-- Botón Vista Gantt -->
        <button type="button" id="btn-view-gantt" onclick="switchView('gantt')"
                class="view-toggle-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all cursor-pointer flex items-center space-x-1.5"
                title="Vista Gantt (Timeline semanal de tareas)">
            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h18M3 8h10M3 12h14M3 16h6M3 20h12" />
            </svg>
            <span class="text-[11px]">Gantt</span>
        </button>
    </div>

    <!-- Botón Iniciar Trabajo (Cronómetro) - Solo visible si hay un proyecto activo -->
    <button type="button" id="btn-start-work-timer-bar" onclick="startWorkTimerForActiveProject()"
            class="hidden px-3.5 py-2 text-xs sm:text-sm font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 active:bg-emerald-200 rounded-xl transition shadow-xs items-center justify-center space-x-1.5 cursor-pointer shrink-0"
            title="Iniciar un trabajo activo con cronómetro en tiempo real (Shift + Ctrl + T)">
        <svg class="w-4 h-4 text-emerald-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
        </svg>
        <span id="btn-start-work-timer-label">Iniciar Trabajo</span>
    </button>

    <!-- Botón Imputar Horas -->
    <button type="button" id="btn-open-timesheet-modal" onclick="openCreateTimesheetModal()"
            class="px-3.5 py-2 text-xs sm:text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 active:bg-sky-800 rounded-xl transition shadow-xs flex items-center justify-center space-x-1.5 cursor-pointer shrink-0"
            title="Registrar horas en tarea de proyecto">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span id="btn-imputar-label">Imputar Horas</span>
    </button>
</div>
{{ end }}
