{{ define "view_calendar" }}
<!-- VISTA 2: Calendario (Semanal - Cuadrícula / Hoja de Datos) -->
<div id="view-container-calendar" class="hidden space-y-4">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-4 sm:px-6 sm:py-4 border-b border-slate-100">
            <div class="flex items-center space-x-2">
                <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2z" />
                </svg>
                <span class="font-bold text-slate-800 text-sm">Hoja Semanal por Proyecto</span>
                <span id="calendar-week-range" class="text-xs text-slate-500 font-medium ml-1"></span>
            </div>
            <div class="text-xs font-semibold text-sky-700 bg-sky-50 px-3 py-1 rounded-lg border border-sky-100 self-start sm:self-auto flex items-center space-x-1.5">
                <span class="text-slate-500">Total Semana:</span>
                <span id="calendar-week-total" class="font-mono font-bold text-sky-800 text-sm">0.00</span>
                <span class="text-slate-500">h</span>
            </div>
        </div>
        <!-- Contenedor scrollable horizontal para la cuadrícula -->
        <div class="overflow-x-auto" id="calendar-grid-container">
            <!-- La tabla de cuadrícula L, M, X, J, V, S, D se genera dinámicamente -->
        </div>
    </div>
</div>
{{ end }}
