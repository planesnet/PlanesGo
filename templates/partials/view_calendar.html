{{ define "view_calendar" }}
<!-- VISTA 2: Calendario (Semanal) -->
<div id="view-container-calendar" class="hidden space-y-4">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 sm:p-5 overflow-hidden">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-4 border-b border-slate-100">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-800 text-sm">Vista Semanal</span>
                <span id="calendar-week-range" class="text-xs text-slate-500 font-medium"></span>
            </div>
            <div class="text-xs font-semibold text-sky-700 bg-sky-50 px-2.5 py-1 rounded-lg border border-sky-100 self-start sm:self-auto">
                Total Semana: <span id="calendar-week-total" class="font-bold">0.00</span> h
            </div>
        </div>
        <!-- Grid de 7 días (Lunes a Domingo) -->
        <div class="grid grid-cols-1 md:grid-cols-7 gap-3 min-h-[360px]" id="calendar-grid-days">
            <!-- Los 7 días se generan dinámicamente -->
        </div>
    </div>
</div>
{{ end }}
