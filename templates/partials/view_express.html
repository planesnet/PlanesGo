{{ define "view_express" }}
<style>
    @keyframes expressActivePulse {
        0%, 100% {
            box-shadow: 0 0 20px -2px rgba(16, 185, 129, 0.45), 0 8px 20px -4px rgba(0, 0, 0, 0.5);
            border-color: #34d399;
        }
        50% {
            box-shadow: 0 0 32px 3px rgba(52, 211, 153, 0.7), 0 10px 24px -4px rgba(0, 0, 0, 0.6);
            border-color: #6ee7b7;
        }
    }
    @keyframes expressAgyPulse {
        0%, 100% {
            box-shadow: 0 0 20px -2px rgba(168, 85, 247, 0.45), 0 8px 20px -4px rgba(0, 0, 0, 0.5);
            border-color: #c084fc;
        }
        50% {
            box-shadow: 0 0 32px 3px rgba(192, 132, 252, 0.7), 0 10px 24px -4px rgba(0, 0, 0, 0.6);
            border-color: #d8b4fe;
        }
    }
    @keyframes expressConfirmPulse {
        0%, 100% {
            transform: scale(1);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
        }
        50% {
            transform: scale(1.02);
            box-shadow: 0 0 28px rgba(245, 158, 11, 0.95);
        }
    }
    .express-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .express-card-running {
        background: linear-gradient(135deg, #065f46 0%, #064e3b 40%, #022c22 100%) !important;
        border: 2px solid #34d399 !important;
        animation: expressActivePulse 3s ease-in-out infinite;
    }
    .express-card-running .express-card-title {
        color: #f0fdf4 !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .express-card-running .border-t {
        border-color: rgba(52, 211, 153, 0.35) !important;
    }
    .express-card-running .text-sky-400 {
        color: #a7f3d0 !important;
    }
    .express-card-running-agy {
        background: linear-gradient(135deg, #4c1d95 0%, #3b0764 40%, #1e1b4b 100%) !important;
        border: 2px solid #c084fc !important;
        animation: expressAgyPulse 3s ease-in-out infinite;
    }
    .express-card-running-agy .express-card-title {
        color: #faf5ff !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .express-card-running-agy .border-t {
        border-color: rgba(192, 132, 252, 0.35) !important;
    }
    .express-card-running-agy .text-sky-400 {
        color: #d8b4fe !important;
    }
    .express-card-paused {
        background: linear-gradient(135deg, #78350f 0%, #451a03 50%, #1e293b 100%) !important;
        border: 2px solid #fbbf24 !important;
        box-shadow: 0 0 18px -2px rgba(245, 158, 11, 0.35) !important;
    }
    .express-card-confirming {
        border: 2px solid #f59e0b !important;
        animation: expressConfirmPulse 1s ease-in-out infinite !important;
    }
</style>
<!-- VISTA Y VENTANA FLOTANTE: Botonera Express Concentrada -->
<div id="view-container-express" class="{{if ne .CurrentView "express"}}hidden{{end}}"></div>

<!-- Ventana Flotante Arrastrable y Redimensionable (Panel de Control de Máquina) -->
<div id="express-floating-window"
     class="hidden fixed z-50 flex flex-col bg-slate-900/95 backdrop-blur-md text-slate-100 rounded-2xl shadow-2xl border border-slate-700/80 transition-shadow select-none"
     style="top: 85px; right: 28px; width: 440px; height: 530px; min-width: 320px; min-height: 200px; max-width: 96vw; max-height: 92vh; resize: both; overflow: hidden;">

    <!-- Barra de Cabecera Arrastrable (Drag Handle) -->
    <div id="express-drag-handle"
         class="flex items-center justify-between px-3.5 py-2.5 bg-slate-800/95 border-b border-slate-700/80 cursor-move rounded-t-2xl shrink-0">
        <div class="flex items-center space-x-2 min-w-0 pointer-events-none">
            <!-- Icono tirador de arrastre -->
            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path d="M7 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" />
            </svg>
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-amber-500/20 text-amber-400 font-bold text-xs shrink-0">
                ⚡
            </span>
            <span class="text-xs font-bold tracking-wide text-slate-100 uppercase truncate">Botonera Express</span>
            <span id="express-tasks-count-badge" class="px-1.5 py-0.2 rounded text-[10px] font-mono font-bold bg-slate-950/80 text-sky-400 border border-slate-700">
                0
            </span>
        </div>

        <!-- Botones de Acción de la Ventana -->
        <div class="flex items-center space-x-1 shrink-0">
            <!-- Botón Refrescar -->
            <button type="button" onclick="loadExpressTimesheets(true)"
                    class="p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-700/60 transition cursor-pointer"
                    title="Recargar tareas recientes">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <!-- Botón Desacoplar (Pop-out a ventana emergente de escritorio) -->
            <button type="button" onclick="openExpressPopout()"
                    class="p-1 rounded-md text-slate-400 hover:text-amber-400 hover:bg-slate-700/60 transition cursor-pointer"
                    title="Desacoplar a ventana independiente de escritorio (pop-out)">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </button>
            <!-- Botón Minimizar / Restaurar -->
            <button type="button" onclick="toggleMinimizeExpress()" id="btn-minimize-express"
                    class="p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-700/60 transition cursor-pointer"
                    title="Minimizar / Restaurar">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
            <!-- Botón Cerrar -->
            <button type="button" onclick="closeExpressFloating()"
                    class="p-1 rounded-md text-slate-400 hover:text-rose-400 hover:bg-slate-700/60 transition cursor-pointer"
                    title="Cerrar ventana">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Contenido y Cuadrícula de la Botonera Concentrada -->
    <div id="express-window-body" class="flex-1 overflow-y-auto p-2.5 space-y-2">
        <!-- Spinner de Carga -->
        <div id="express-loading-state" class="hidden py-10 text-center">
            <div class="inline-block w-6 h-6 border-2 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-slate-400 font-medium mt-2">Cargando botonera...</p>
        </div>

        <!-- Estado Vacío -->
        <div id="express-empty-state" class="hidden py-8 text-center">
            <div class="w-10 h-10 mx-auto rounded-xl bg-slate-800 text-slate-500 flex items-center justify-center mb-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
            </div>
            <h3 class="text-xs font-bold text-slate-300">Sin tareas recientes</h3>
            <p class="text-[11px] text-slate-500 mt-1">
                No hay imputaciones en las 2 últimas semanas.
            </p>
        </div>

        <!-- Matriz de Botones Concentrados a 1 Columna (Igual que en Móvil) -->
        <div id="express-grid-container" class="grid grid-cols-1 gap-2.5">
            <!-- Las teclas de la botonera se renderizan dinámicamente -->
        </div>
    </div>

    <!-- Indicador de Redimensión en la Esquina Inferior Derecha -->
    <div class="pointer-events-none absolute bottom-0.5 right-0.5 text-slate-600">
        <svg class="w-2.5 h-2.5" viewBox="0 0 6 6" fill="currentColor">
            <circle cx="5" cy="5" r="0.75" />
            <circle cx="5" cy="2" r="0.75" />
            <circle cx="2" cy="5" r="0.75" />
        </svg>
    </div>
</div>
{{ end }}
