{{ define "week_selector" }}
<!-- Selector de Semanas con Métricas Generales Integradas Minimalistas -->
<div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
    <!-- Cabecera: Información de la Semana y Botones de Navegación -->
    <div class="p-3.5 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <!-- Información de la Semana -->
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center shrink-0 border border-sky-100">
                <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2z" />
                </svg>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <span id="week-title-display" class="text-sm font-bold text-slate-900">
                        Semana actual
                    </span>
                    <span id="current-week-badge" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-50 text-sky-700 border border-sky-200/80">
                        Semana actual
                    </span>
                </div>
                <div id="week-dates-display" class="text-xs font-medium text-slate-500 font-mono mt-0.5">
                    Cargando fechas...
                </div>
            </div>
        </div>

        <!-- Navegación Anterior / Siguiente -->
        <div class="flex items-center space-x-2 self-end sm:self-auto">
            <!-- Botón Semana Anterior -->
            <button type="button" id="btn-prev-week" onclick="navigateWeek(-1)"
                    class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
                    title="Semana anterior">
                <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span class="hidden sm:inline">Anterior</span>
            </button>

            <!-- Botón Semana Siguiente -->
            <button type="button" id="btn-next-week" onclick="navigateWeek(1)"
                    class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
                    title="Semana siguiente">
                <span class="hidden sm:inline">Siguiente</span>
                <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Franja de Métricas Generales Minimalistas de la Semana -->
    <div class="bg-slate-50/70 border-t border-slate-100 px-3.5 py-2.5 sm:px-4 grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-4">
        <!-- Horas Totales -->
        <div class="flex items-center space-x-2">
            <div class="w-2 h-2 rounded-full bg-sky-500 shrink-0"></div>
            <div class="min-w-0 flex items-baseline space-x-1 text-xs">
                <span class="text-slate-500 font-medium">Horas:</span>
                <span class="font-bold text-slate-900 tabular-nums text-sm" id="kpi-total-hours">{{printf "%.2f" .TotalHours}}</span>
                <span class="font-semibold text-sky-600 text-[11px]">h</span>
            </div>
        </div>

        <!-- Proyectos Activos -->
        <div class="flex items-center space-x-2">
            <div class="w-2 h-2 rounded-full bg-indigo-500 shrink-0"></div>
            <div class="min-w-0 flex items-baseline space-x-1 text-xs">
                <span class="text-slate-500 font-medium">Proyectos:</span>
                <span class="font-bold text-slate-900 tabular-nums text-sm" id="kpi-total-projects">{{if .Projects}}{{len .Projects}}{{else}}{{.UniqueProjectsCount}}{{end}}</span>
                <span class="text-slate-400 text-[11px]">activos</span>
            </div>
        </div>

        <!-- Partes de Horas -->
        <div class="flex items-center space-x-2">
            <div class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></div>
            <div class="min-w-0 flex items-baseline space-x-1 text-xs">
                <span class="text-slate-500 font-medium">Partes:</span>
                <span class="font-bold text-slate-900 tabular-nums text-sm" id="kpi-total-entries">{{len .Entries}}</span>
                <span class="text-slate-400 text-[11px]">imputaciones</span>
            </div>
        </div>

        <!-- Miembros -->
        <div class="flex items-center space-x-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></div>
            <div class="min-w-0 flex items-baseline space-x-1 text-xs">
                <span class="text-slate-500 font-medium">Miembros:</span>
                <span class="font-bold text-slate-900 tabular-nums text-sm" id="kpi-total-employees">{{.UniqueEmployeesCount}}</span>
                <span class="text-slate-400 text-[11px]">usuarios</span>
            </div>
        </div>
    </div>
</div>
{{ end }}
