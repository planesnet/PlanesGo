{{ define "navbar" }}
<!-- Navbar Corporativo Planes -->
<header class="bg-[#0B0F19] border-b border-slate-800 sticky top-0 z-30 shadow-md">
    <div class="w-full px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- Logo y Branding -->
            <div class="flex items-center space-x-3 sm:space-x-4">
                <a href="/" class="flex items-center space-x-3 group">
                    <img src="/static/img/logo.png" alt="Planes Soluciones Informáticas" class="h-9 w-auto object-contain">
                    <div class="hidden sm:block border-l border-slate-700 pl-3">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-sm font-bold text-white tracking-tight">PlanesGo</span>
                            <span class="text-[10px] font-semibold text-sky-400 bg-sky-950 px-2 py-0.5 rounded-full border border-sky-800/60">v{{.Version}}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 font-light">Proyectos y Horas Odoo</p>
                    </div>
                </a>
            </div>

            <!-- Usuario y Acciones -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Perfil de Usuario -->
                <div class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800">
                    {{if .Session.UserPicture}}
                    <img src="{{.Session.UserPicture}}" alt="{{.Session.UserName}}" class="w-6 h-6 rounded-full border border-sky-500/40 object-cover">
                    {{else}}
                    <div class="w-6 h-6 rounded-full bg-sky-900 text-sky-200 text-xs font-bold flex items-center justify-center uppercase">
                        {{slice .Session.Username 0 1}}
                    </div>
                    {{end}}
                    <div class="flex flex-col text-left">
                        <span class="text-xs font-semibold text-slate-200 max-w-[130px] sm:max-w-[180px] truncate">
                            {{if .Session.UserName}}{{.Session.UserName}}{{else}}{{.Session.Username}}{{end}}
                        </span>
                        <span class="text-[10px] text-emerald-400 flex items-center font-mono">
                            <span class="w-1.5 h-1.5 mr-1 bg-emerald-400 rounded-full animate-pulse"></span>
                            {{.Config.Odoo.DB}}
                        </span>
                    </div>
                </div>

                <!-- Botón Probar Avisos del Cronómetro -->
                <button type="button" onclick="testTimerNotification()" id="btn-test-notification" title="Probar avisos sonoros y notificaciones de escritorio" class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold text-amber-300 hover:text-white bg-amber-950/40 hover:bg-amber-900/60 rounded-xl transition border border-amber-800/50 shadow-sm cursor-pointer">
                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span class="hidden md:inline">Probar avisos</span>
                </button>

                <!-- Botón Ajustes -->
                <a href="/settings" title="Ajustes de Usuario y Token Odoo" class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-xl transition border border-slate-700/60 shadow-sm">
                    <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="hidden md:inline">Ajustes</span>
                </a>

                <!-- Botón Recargar -->
                <a href="/" title="Recargar datos de Odoo" class="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-xl transition border border-slate-700/60">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </a>

                <!-- Botón Salir -->
                <a href="/logout" title="Cerrar sesión" class="p-2 text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-900/60 rounded-xl transition border border-red-900/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</header>
{{ end }}
