<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ PlanesGo Express - Botonera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col select-none overflow-hidden"
      data-current-worker="{{.CurrentWorker}}"
      data-today="{{.Today}}"
      data-is-standalone="true">

    <!-- Cabecera de la mini-ventana -->
    <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-2 min-w-0">
            <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold text-sm shrink-0">
                ⚡
            </span>
            <div class="min-w-0">
                <div class="flex items-center space-x-2">
                    <h1 class="text-xs font-bold text-slate-100 tracking-wide uppercase truncate">Botonera Express</h1>
                    <span id="express-tasks-count-badge" class="px-1.5 py-0.2 rounded text-[10px] font-mono font-bold bg-slate-800 text-sky-400 border border-slate-700">
                        ...
                    </span>
                </div>
                <p class="text-[10px] text-slate-400 truncate">1-clic para cambiar de tarea (últimas 2 sem.)</p>
            </div>
        </div>

        <div class="flex items-center space-x-1.5 shrink-0">
            <!-- Botón de recarga -->
            <button type="button" onclick="loadExpressTimesheets(true)"
                    class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer"
                    title="Recargar tareas recientes">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <!-- Buscador rápido en ventana -->
            <input type="text" id="filter-search" oninput="renderExpressView()"
                   placeholder="Filtrar..."
                   class="w-24 sm:w-32 bg-slate-800 border border-slate-700 text-slate-200 text-[11px] rounded-lg px-2 py-1 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
        </div>
    </header>

    <!-- Cuerpo principal de la botonera con scroll -->
    <main class="flex-1 overflow-y-auto p-2.5">
        <!-- Estado de carga -->
        <div id="express-loading-state" class="flex flex-col items-center justify-center py-12 space-y-3">
            <svg class="animate-spin h-6 w-6 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs text-slate-400 font-medium">Cargando botonera...</span>
        </div>

        <!-- Estado vacío -->
        <div id="express-empty-state" class="hidden flex flex-col items-center justify-center py-12 text-center p-4">
            <div class="w-10 h-10 rounded-xl bg-slate-800 text-slate-500 flex items-center justify-center mb-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                </svg>
            </div>
            <p class="text-xs font-semibold text-slate-300">No hay tareas en las últimas 2 semanas</p>
        </div>

        <!-- Cuadrícula concentrada tipo máquina -->
        <div id="express-grid-container" class="grid grid-cols-2 gap-2"></div>
    </main>

    <!-- Toast de notificaciones de la mini-ventana -->
    <div id="toast-container" class="fixed bottom-3 right-3 z-50 pointer-events-none space-y-2"></div>

    <!-- Scripts de PlanesGo con Cache-Busting -->
    <script src="/static/js/utils.js?v={{.Version}}"></script>
    <script src="/static/js/timer.js?v={{.Version}}"></script>
    <script src="/static/js/views.js?v={{.Version}}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar carga de la botonera Express directamente
            loadExpressTimesheets();

            // Sincronización entre ventanas mediante storage event
            window.addEventListener('storage', function(e) {
                if (e.key === 'planesgo_active_timer' || e.key === 'planesgo_timer_action') {
                    if (typeof updateExpressTimerState === 'function') {
                        updateExpressTimerState();
                    }
                }
            });
        });
    </script>
</body>
</html>
