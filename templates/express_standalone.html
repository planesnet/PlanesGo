<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Botonera Express - PlanesGo</title>

    <!-- Metadatos y Manifiesto PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Express">
    <link rel="apple-touch-icon" href="/static/img/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-height: 100dvh;
        }
        html, body {
            height: var(--app-height);
            min-height: var(--app-height);
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #020617;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col select-none"
      data-current-worker="{{.CurrentWorker}}"
      data-today="{{.Today}}"
      data-app-version="{{.Version}}"
      data-is-standalone="true">

    <!-- Barra de búsqueda minimalista (sin cabecera) -->
    <div class="px-3 pt-2.5 pb-2 shrink-0 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80 flex items-center gap-2">
        <div class="relative flex-1">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <input type="search" id="filter-search" oninput="handleExpressSearchInput(this)"
                   placeholder="Buscar proyecto o tarea..."
                   autocomplete="off" autocorrect="off" spellcheck="false"
                   class="w-full bg-slate-900 border border-slate-800 text-slate-100 text-xs sm:text-sm rounded-xl pl-9 pr-9 py-2 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-sky-500 focus:border-sky-500 transition shadow-inner">
            <button type="button" id="clear-search-btn" onclick="clearExpressSearch()"
                    class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white cursor-pointer"
                    title="Limpiar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <button type="button" onclick="loadExpressTimesheets(true)"
                class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800 active:scale-95 transition cursor-pointer shrink-0"
                title="Recargar tareas">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </button>
    </div>

    <!-- Cuerpo principal de la botonera con scroll fluido -->
    <main class="flex-1 overflow-y-auto p-2.5 sm:p-3 overscroll-contain">
        <!-- Estado de carga -->
        <div id="express-loading-state" class="flex flex-col items-center justify-center py-16 space-y-3">
            <svg class="animate-spin h-7 w-7 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs text-slate-400 font-medium tracking-wide">Cargando botonera...</span>
        </div>

        <!-- Estado vacío -->
        <div id="express-empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center p-4">
            <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 text-slate-500 flex items-center justify-center mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                </svg>
            </div>
            <p class="text-sm font-semibold text-slate-300">No hay tareas en los últimos 5 días</p>
            <p class="text-xs text-slate-500 mt-1">Imputa desde la web o usa el buscador</p>
        </div>

        <!-- Cuadrícula responsive de botones de tarea -->
        <div id="express-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-2.5"></div>
    </main>

    <!-- Toast de notificaciones flotante -->
    <div id="toast-container" class="fixed bottom-3 right-3 z-50 pointer-events-none space-y-2"></div>

    <!-- Scripts de PlanesGo con Cache-Busting -->
    <script>
        window.projectPartnerMap = {{if .ProjectPartnerMapJSON}}{{.ProjectPartnerMapJSON}}{{else}}{}{{end}};
        
        function handleExpressSearchInput(input) {
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) {
                if (input.value && input.value.trim().length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
            }
            if (typeof renderExpressView === 'function') {
                renderExpressView();
            }
        }

        function clearExpressSearch() {
            const input = document.getElementById('filter-search');
            const clearBtn = document.getElementById('clear-search-btn');
            if (input) {
                input.value = '';
                input.focus();
            }
            if (clearBtn) clearBtn.classList.add('hidden');
            if (typeof renderExpressView === 'function') {
                renderExpressView();
            }
        }
    </script>
    <script src="/static/js/utils.js?v={{.Version}}"></script>
    <script src="/static/js/timer.js?v={{.Version}}"></script>
    <script src="/static/js/views.js?v={{.Version}}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar carga de la botonera Express
            loadExpressTimesheets();

            // Sincronización entre pestañas / ventanas mediante storage event
            window.addEventListener('storage', function(e) {
                if (e.key === 'planesgo_active_timer' || e.key === 'planesgo_timer_action') {
                    if (typeof updateExpressTimerState === 'function') {
                        updateExpressTimerState();
                    }
                }
            });

            // Registro de Service Worker para PWA instalable
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(reg => {
                        console.log('[PlanesGo PWA] Service Worker registrado con éxito:', reg.scope);
                        // Comprobar si hay un SW en espera y actualizar
                        if (reg.waiting) {
                            reg.waiting.postMessage({ action: 'skipWaiting' });
                        }
                    })
                    .catch(err => {
                        console.warn('[PlanesGo PWA] Error registrando Service Worker:', err);
                    });

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            }

            // Auto-actualización ante nueva versión desplegada
            const currentAppVersion = "{{.Version}}";
            function checkForUpdates() {
                fetch('/api/version', { cache: 'no-store' })
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.version && data.version !== currentAppVersion) {
                            console.log('[PlanesGo PWA] Nueva versión detectada (' + data.version + ' vs ' + currentAppVersion + '). Actualizando...');
                            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                                navigator.serviceWorker.controller.postMessage({ action: 'skipWaiting' });
                            }
                            window.location.reload();
                        }
                    })
                    .catch(() => {});
            }

            // Comprobar actualización cada 60 segundos y al reactivar la app/pantalla
            setInterval(checkForUpdates, 60000);
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    checkForUpdates();
                    if (typeof updateExpressTimerState === 'function') {
                        updateExpressTimerState();
                    }
                }
            });
        });
    </script>
</body>
</html>
