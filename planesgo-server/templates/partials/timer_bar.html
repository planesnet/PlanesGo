{{ define "timer_bar" }}
<!-- Datos de Temporizador Activo SSR (Oculto en cabecera) -->
{{if .ActiveTimer}}
<div id="active-timer-container" class="hidden" style="display: none !important;"
     data-server-timer="true"
     data-timesheet-id="{{.ActiveTimer.TimesheetID}}"
     data-project-id="{{.ActiveTimer.ProjectID}}"
     data-project-name="{{.ActiveTimer.ProjectName}}"
     data-task-id="{{.ActiveTimer.TaskID}}"
     data-task-name="{{.ActiveTimer.TaskName}}"
     data-desc="{{.ActiveTimer.Description}}"
     data-accumulated-ms="{{.ActiveTimer.AccumulatedMs}}"
     data-started-at="{{.ActiveTimer.StartedAt}}"
     data-is-running="{{if .ActiveTimer.IsRunning}}true{{else}}false{{end}}">
</div>
{{end}}

{{ template "confirm_modal" . }}
{{ end }}
