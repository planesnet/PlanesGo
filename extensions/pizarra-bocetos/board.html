<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizarra de bocetos</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Pizarra de bocetos</h1>
    <p>Dibuja cómo quieres la pantalla o marca encima de la página, y copia la imagen para compartirla.</p>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Herramientas de dibujo">
    <div class="group" aria-label="Herramienta">
      <button class="tbtn" data-tool="select" title="Seleccionar y mover (V)" aria-label="Seleccionar"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
      <button class="tbtn" data-tool="pen" aria-pressed="true" title="Lápiz (P)" aria-label="Lápiz"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
      <button class="tbtn" data-tool="rect" title="Rectángulo (R)" aria-label="Rectángulo"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
      <button class="tbtn" data-tool="line" title="Línea (L)" aria-label="Línea"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
      <button class="tbtn" data-tool="arrow" title="Flecha (A)" aria-label="Flecha"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M10 5h9v9"/></svg></button>
      <button class="tbtn" data-tool="text" title="Texto (T): clic para escribir; clic o doble clic sobre un texto para cambiarlo" aria-label="Texto"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg></button>
      <button class="tbtn" data-tool="box" title="Caja de texto (B): arrastra para crearla; doble clic para cambiar el texto" aria-label="Caja de texto"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg></button>
      <button class="tbtn" data-tool="eraser" title="Borrador (E): borra el trazo que tocas" aria-label="Borrador"><svg viewBox="0 0 24 24"><path d="M7 20h11"/><path d="M4 15l9-9 6 6-7 7H8z"/></svg></button>
    </div>
    <div class="group" aria-label="Color">
      <button class="swatch" data-color="#142030" style="background:#142030" aria-pressed="true" title="Negro" aria-label="Color negro"></button>
      <button class="swatch" data-color="#0284c7" style="background:#0284c7" title="Azul" aria-label="Color azul"></button>
      <button class="swatch" data-color="#dc2626" style="background:#dc2626" title="Rojo (para marcar)" aria-label="Color rojo"></button>
      <button class="swatch" data-color="#059669" style="background:#059669" title="Verde" aria-label="Color verde"></button>
      <button class="swatch" data-color="#ea580c" style="background:#ea580c" title="Naranja" aria-label="Color naranja"></button>
      <button class="swatch" data-color="#7c3aed" style="background:#7c3aed" title="Morado" aria-label="Color morado"></button>
    </div>
    <div class="group" aria-label="Grosor">
      <button class="tbtn" data-size="2" title="Fino" aria-label="Trazo fino"><span class="size-dot" style="width:4px;height:4px"></span></button>
      <button class="tbtn" data-size="4" aria-pressed="true" title="Medio" aria-label="Trazo medio"><span class="size-dot" style="width:7px;height:7px"></span></button>
      <button class="tbtn" data-size="9" title="Grueso" aria-label="Trazo grueso"><span class="size-dot" style="width:12px;height:12px"></span></button>
    </div>
    <div class="group" aria-label="Orientación de la pantalla">
      <button class="tbtn" data-orient="v" aria-pressed="false" title="Móvil en vertical" aria-label="Móvil en vertical"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
      <button class="tbtn" data-orient="c" hidden title="Dibujar encima de la página desde la que abriste la pizarra" aria-label="Captura de la página"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="tbtn" data-orient="h" aria-pressed="true" title="Móvil en horizontal" aria-label="Móvil en horizontal"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M18 11v2"/></svg></button>
    </div>
    <div class="group" aria-label="Patrón de diseño">
      <select id="pattern" title="Cargar un patrón de diseño (se adapta a vertical y horizontal)" aria-label="Patrón de diseño"><option value="">Sin patrón</option></select>
    </div>
    <div class="group">
      <button class="tbtn" id="snap" aria-pressed="true" title="Ajustar rectángulos, líneas, flechas y texto a la rejilla (G)" aria-label="Ajustar a rejilla"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/></svg></button>
    </div>
    <div class="group">
      <button class="tbtn" id="undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="tbtn" id="redo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button class="tbtn" id="delete-sel" disabled title="Eliminar el objeto seleccionado (Supr)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Eliminar</button>
      <span id="clear-wrap"><button class="tbtn" id="clear" title="Borrar todo">Borrar todo</button></span>
    </div>
    <div class="group">
      <button class="tbtn" id="copy-btn" title="Copiar imagen al portapapeles (Ctrl+V para pegarla)" aria-label="Copiar imagen"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></button>
      <button class="tbtn" id="download-btn" title="Descargar PNG" aria-label="Descargar PNG"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button>
    </div>
  </div>

  <section class="stage" aria-label="Lienzo">
    <div class="paper" id="paper">
      <canvas id="bg" aria-hidden="true"></canvas>
      <canvas id="draw" aria-label="Lienzo de dibujo"></canvas>
    </div>
  </section>

</div>
<div class="ctx-menu" id="ctx-menu" role="menu" aria-label="Acciones del objeto" hidden>
  <button type="button" role="menuitem" data-act="group">Agrupar<kbd>Ctrl+G</kbd></button>
  <button type="button" role="menuitem" data-act="ungroup">Desagrupar<kbd>Ctrl+Mayús+G</kbd></button>
  <hr>
  <button type="button" role="menuitem" data-act="front">Traer al frente</button>
  <button type="button" role="menuitem" data-act="back">Enviar al fondo</button>
  <hr>
  <button type="button" role="menuitem" data-act="delete" class="danger">Eliminar<kbd>Supr</kbd></button>
</div>
<div class="toast" id="status" role="status" aria-live="polite"></div>

<script src="patterns.js"></script>
<script src="sketch.js"></script>
<script src="board.js"></script>
</body>
</html>
